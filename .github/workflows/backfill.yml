name: Backfill the Yield Spread History

# Run by hand from the Actions tab: Run workflow. It pulls every day in the
# window committed in src/settings.py (START_DATE to END_DATE) in one FRED
# request per series, adds them to the history on the monitor-history
# branch, and stops. The next run of the daily workflow publishes them, or
# press Run workflow on it.
#
# This is plain `doit`, the default pipeline. Run it once after you add the
# secret, and again if the history ever has a gap: move START_DATE and
# END_DATE in src/settings.py to cover the gap, commit, push, then press Run
# workflow. The window is a commit, not an input to the job, so that the
# commit says what was pulled. The daily job reaches back ten days, so an
# END_DATE more than ten days old leaves a gap: move it before you backfill.
on:
  workflow_dispatch:

permissions:
  contents: write

# The same group as the daily workflow, so the two never push at once.
concurrency:
  group: yield-spread-monitor
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      HISTORY_BRANCH: monitor-history
      HISTORY_FILE: spread_history.csv

    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Restore the history from the monitor-history branch
        run: |
          mkdir -p _output
          if git fetch --quiet origin "$HISTORY_BRANCH:$HISTORY_BRANCH" 2>/dev/null; then
            git show "$HISTORY_BRANCH:$HISTORY_FILE" > "_output/$HISTORY_FILE"
            echo "Restored $(( $(wc -l < "_output/$HISTORY_FILE") - 1 )) days from $HISTORY_BRANCH"
          else
            echo "No $HISTORY_BRANCH branch yet: the history starts with this backfill"
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Backfill (pull every day in the committed window, add them to the history)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv run doit

      - name: Record the history on the monitor-history branch
        # The commit message names the window that was pulled, read from the
        # same settings the pull used.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WINDOW=$(uv run python -c 'import sys; sys.path.insert(0, "src"); import settings; print(settings.START_DATE, "to", settings.END_DATE)')
          HISTORY="$RUNNER_TEMP/history"
          if git show-ref --quiet "refs/heads/$HISTORY_BRANCH"; then
            git worktree add "$HISTORY" "$HISTORY_BRANCH"
          else
            git worktree add --orphan -b "$HISTORY_BRANCH" "$HISTORY"
          fi
          cp "_output/$HISTORY_FILE" "$HISTORY/"
          cd "$HISTORY"
          git add "$HISTORY_FILE"
          git diff --cached --quiet || git commit -m "Backfill $WINDOW, history through $(tail -n 1 "$HISTORY_FILE" | cut -d, -f1)"
          git push origin "$HISTORY_BRANCH"
