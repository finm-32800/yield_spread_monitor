[project]
name = "yield-spread-monitor"
version = "0.1.0"
description = "A daily monitor of the 10-year minus 2-year Treasury spread, published by GitHub Actions"
requires-python = ">=3.12"
dependencies = [
    "doit>=0.36",
    "pandas>=2.2",
    "plotly>=5.24",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src"]
